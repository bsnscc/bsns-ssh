name: BsnsSSH
options:
  bundleIdPrefix: cc.bsns
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  bsns-ssh:
    path: ..
  SwiftTerm:
    # Vendored fork (vendor/SwiftTerm) of upstream 1.13.0, patched for pointer
    # click-drag selection + PageUp/PageDown-to-remote. See vendor/SwiftTerm/PATCHES.md.
    path: vendor/SwiftTerm
  CSSH:
    # Vendored locally (vendor/CSSH/CSSH.xcframework), built from source by
    # vendor/build-cssh.sh — libssh2 1.11.1 on OpenSSL 3.5.9, pinned + sha256-
    # verified. Referenced by path; the xcframework itself is gitignored.
    path: vendor/CSSH
  YubiKit:
    url: https://github.com/Yubico/yubikit-swift
    exactVersion: "1.3.0"
  CMosh:
    # Vendored mosh client + protobuf-lite (C++ with a plain-C interface).
    # Run vendor/mosh/fetch-mosh.sh to populate its source trees.
    path: vendor/mosh
targets:
  # Opens a sealed question when its push arrives, so the notification can show
  # it, with its answers as buttons, instead of a placeholder.
  BsnsNotify:
    type: app-extension
    platform: iOS
    sources:
      - NotifyExtension
      - path: Sources/Link/RelayKeyVault.swift
    dependencies:
      - package: bsns-ssh
        product: BsnsSSHCore
    info:
      path: NotifyExtension/Info.plist
      properties:
        CFBundleDisplayName: bsns.SSH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BsnsKeychainPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotifyExtension/BsnsNotify.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.bsns.ssh
        com.apple.developer.icloud-services:
          - CloudKit
        # Only the message keys the app shares with it — not the app's own keychain.
        keychain-access-groups:
          - $(AppIdentifierPrefix)cc.bsns.ssh.relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.bsns.ssh.notify
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "100"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "4L394FY4WC"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  BsnsSSH:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: BsnsNotify
      - package: bsns-ssh
        product: BsnsSSHCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: CSSH
        product: CSSH
      - package: YubiKit
        product: YubiKit
      - package: CMosh
        product: CMosh
    # A managed Info.plist (rather than GENERATE_INFOPLIST_FILE) because the NFC
    # ISO7816 select-identifiers list is an array, which build settings can't set.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: bsns.SSH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BsnsKeychainPrefix: $(AppIdentifierPrefix)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Connecting to LAN / tailnet SSH hosts trips iOS's local-network gate.
        NSLocalNetworkUsageDescription: "Connect to SSH servers on your local network, and lend this phone's keys to a computer you have paired."
        # Advertised when "Phone as a Key" is on, so a paired computer can find this phone.
        NSBonjourServices:
          - _bsns-key._tcp
        # Woken by the push that says a question or notice has arrived.
        UIBackgroundModes:
          - remote-notification
        # bsns-ssh://open?host=…&tmux=… and bsns-ssh://workspace?name=…
        CFBundleURLTypes:
          - CFBundleURLName: cc.bsns.ssh.link
            CFBundleURLSchemes:
              - bsns-ssh
        # Required to evaluate Face ID for the optional app lock.
        NSFaceIDUsageDescription: "Unlock the app with Face ID."
        # Talk to a YubiKey over NFC.
        NFCReaderUsageDescription: "Communicate with your YubiKey over NFC to sign in."
        # AIDs the app may select over NFC: YubiKey management, FIDO, OATH, PIV.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A000000527471117
          - A0000006472F0001
          - A0000005272101
          - A000000308
        # Existing declaration: verify the classification before public release.
        # See docs/export-compliance.md; standard algorithms alone do not prove exemption.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.bsns.ssh
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "100"
        # App UI layer stays Swift 5 mode for now; the BsnsSSHCore package is
        # already Swift 6 strict-concurrency clean on its own.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing for device + TestFlight (Graham Saathoff's team).
        DEVELOPMENT_TEAM: "4L394FY4WC"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BsnsSSH.entitlements
      properties:
        # USB-C smart-card access for YubiKey PIV.
        com.apple.security.smartcard: true
        # NFC ISO7816 (tag) reading for YubiKey-over-NFC.
        com.apple.developer.nfc.readersession.formats: [TAG]
        # FIDO2 security keys / passkeys (WebAuthn) — associates the app with the
        # relying-party domain (tools.bsns.cc serves the matching AASA). Required
        # for the platform-passkey provider; harmless for external security keys.
        com.apple.developer.associated-domains:
          - webcredentials:tools.bsns.cc
        # Questions and notices from paired computers arrive through the user's
        # private iCloud database; Apple's push is what wakes the phone for them.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.bsns.ssh
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # The app's own group stays FIRST: it is where every existing item lives
        # and where new ones go by default. The second is shared with the
        # notification extension and holds only derived message keys.
        keychain-access-groups:
          - $(AppIdentifierPrefix)cc.bsns.ssh
          - $(AppIdentifierPrefix)cc.bsns.ssh.relay
