name: BsnsSSHMac
options:
  bundleIdPrefix: cc.bsns
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  bsns-ssh:
    path: ..
  SwiftTerm:
    # The same vendored fork the iOS app uses (see app/vendor/SwiftTerm/PATCHES.md).
    path: ../app/vendor/SwiftTerm
  CSSH:
    # libssh2 + OpenSSL, built by app/vendor/build-cssh.sh (which includes the
    # macOS slices).
    path: ../app/vendor/CSSH
  CMosh:
    path: ../app/vendor/mosh
targets:
  # `bsns ask` / `bsns notify`: the command-line way in for scripts. Shipped
  # inside the app, beside its main executable.
  bsns:
    configFiles:
      Debug: ../Signing.xcconfig
      Release: ../Signing.xcconfig
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: bsns
        PRODUCT_BUNDLE_IDENTIFIER: cc.bsns.ssh.mac.cli
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  BsnsSSHMac:
    configFiles:
      Debug: ../Signing.xcconfig
      Release: ../Signing.xcconfig
    type: application
    platform: macOS
    sources:
      - Sources
      # Shared with the iOS app: the agent and key storage, the session layer and
      # both transports. Listed file by file so that anything touch-specific
      # stays out, and so that adding to this list is a deliberate act.
      - path: ../app/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../app/Sources/AgentStore.swift
        group: Shared
      - path: ../app/Sources/DiagLog.swift
        group: Shared
      - path: ../app/Sources/PublicKeyText.swift
        group: Shared
      - path: ../app/Sources/TerminalTheme.swift
        group: Shared
      - path: ../app/Sources/Storage
        group: Shared
      - path: ../app/Sources/Session/TerminalSession.swift
        group: Shared/Session
      - path: ../app/Sources/Session/TerminalTransport.swift
        group: Shared/Session
      - path: ../app/Sources/Session/SessionStore.swift
        group: Shared/Session
      - path: ../app/Sources/Session/SessionRestoreStore.swift
        group: Shared/Session
      - path: ../app/Sources/Session/TmuxPanelModel.swift
        group: Shared/Session
      - path: ../app/Sources/Session/SessionHandoffStore.swift
        group: Shared/Session
      - path: ../app/Sources/Session/MachineBoard.swift
        group: Shared/Session
      # Machines and Workspaces: the same screens on the Mac and on an iPad.
      - path: ../app/Sources/Machines
        group: Shared
      - path: ../app/Sources/Session/SessionOpener.swift
        group: Shared/Session
      - path: ../app/Sources/Session/WorkspaceStore.swift
        group: Shared/Session
      - path: ../app/Sources/Transport
        group: Shared
      - path: ../app/Sources/Mosh
        group: Shared
      # The device link: transport and paired-device store. (The key server and
      # its screen in the same folder are iOS-only and compile to nothing here.)
      - path: ../app/Sources/Link
        group: Shared
      - path: ../app/Sources/Settings/AppSettings.swift
        group: Shared/Settings
      - path: ../app/Sources/Settings/CommandHistory.swift
        group: Shared/Settings
      # Encrypted config sync: the bundle format, its crypto and the folder store.
      - path: ../app/Sources/Settings/ConfigBundle.swift
        group: Shared/Settings
      - path: ../app/Sources/Settings/ConfigService.swift
        group: Shared/Settings
      - path: ../app/Sources/Settings/ConfigSync.swift
        group: Shared/Settings
      - path: ../app/Sources/Settings/SyncStore.swift
        group: Shared/Settings
      - path: ../app/Sources/Settings/Snippets.swift
        group: Shared/Settings
    # The command-line tool rides inside the app, beside its main executable
    # (copied with its own signature, before the app itself is signed).
    postCompileScripts:
      - name: Embed bsns
        script: |
          cp -f "${BUILT_PRODUCTS_DIR}/bsns" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/bsns"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/bsns
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(EXECUTABLE_FOLDER_PATH)/bsns
    dependencies:
      - target: bsns
        embed: false
        link: false
      - package: bsns-ssh
        product: BsnsSSHCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: CSSH
        product: CSSH
      - package: CMosh
        product: CMosh
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: bsns.SSH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: "Connect to SSH servers on your local network, and use the keys on an iPhone you have paired."
        NSBonjourServices:
          - _bsns-key._tcp
        # bsns-ssh://open?host=…&tmux=… and bsns-ssh://workspace?name=…
        CFBundleURLTypes:
          - CFBundleURLName: cc.bsns.ssh.link
            CFBundleURLSchemes:
              - bsns-ssh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.bsns.ssh.mac
        PRODUCT_NAME: bsns.SSH
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Signed with the team's development identity, so the signature — and
        # with it the keychain items and privacy grants tied to it — stays the
        # same from one build to the next. Distribution outside the team still
        # needs a Developer ID build and notarization; the App Store, the sandbox.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: BsnsSSHMac.entitlements
